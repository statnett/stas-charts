name: helm-chart-lint

on: pull_request

permissions:
  contents: read

env:
  CHART_PATH: charts/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Lint and render
        run: |
          for dir in $(find "$CHART_PATH" -mindepth 1 -maxdepth 1 -type d); do
            helm lint "$dir"
            helm template test "$dir" > /dev/null
          done
