name: helm-chart

on: pull_request

permissions:
  contents: read

env:
  CHART_PATH: charts/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 4.3.1

      - name: Lint
        run: |
          for dir in $(find "$CHART_PATH" -mindepth 1 -maxdepth 1 -type d); do
            helm lint "$dir"
          done

      - name: Package chart
        run: helm package "$CHART_PATH"
