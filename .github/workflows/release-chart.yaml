name: release-chart

on:
  push:
    tags:
      - '**'

jobs:
  push-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for pushing
      id-token: write # for signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ $REF_NAME != */* ]]; then
            echo "Ref name is not in the format component/version"
            exit 1
          fi
          echo "component=$(echo "$REF_NAME" | cut -d'/' -f 1)" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$REF_NAME" | cut -d'/' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Push chart
        id: push
        env:
          COMPONENT: ${{ steps.prep.outputs.component }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          chart_name=$(helm show chart dist/*.tgz | awk '/^name:/ {print $2}')
          output=$(helm push dist/*.tgz "oci://$repo" 2>&1)
          echo "$output"
          digest=$(awk '/^Digest:/ {print $2}' <<< "$output")
          [[ -n "$digest" ]] || { echo "Could not find digest"; exit 1; }
          echo "digest-url=$repo/$chart_name@$digest" >> "$GITHUB_OUTPUT"

      - name: Sign chart
        run: cosign sign --yes "$DIGEST_URL"
        env:
          DIGEST_URL: ${{ steps.push.outputs.digest-url }}
